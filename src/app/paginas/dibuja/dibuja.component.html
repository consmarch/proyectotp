<div class="d-flex h-100">
  <!-- Barra lateral -->
  <div class="sidebar bg-pink d-flex flex-column align-items-center py-3">
    <button mat-icon-button (click)="selectTool('shape')">
      <img src="img/forma.png" alt="Formas" class="tool-icon">
    </button>
    <button mat-icon-button (click)="selectTool('text')">
      <img src="img/texto.png" alt="Texto" class="tool-icon">
    </button>
    <button mat-icon-button (click)="selectTool('brush')">
      <img src="img/pincel.png" alt="Pincel" class="tool-icon">
    </button>
    <button mat-icon-button (click)="selectTool('image')">
      <img src="img/subir.png" alt="Imagen" class="tool-icon">
    </button>
  </div>

  <!-- Lienzo -->
  <div class="canvas-area flex-grow-1 p-2">
    <canvas #canvas width="800" height="500" class="border w-100 h-100"></canvas>
  </div>
</div>
