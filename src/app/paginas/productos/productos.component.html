<div class="fotopro"> <img src="img/arpro.png" alt="" aria-hidden="true" class="bd-placeholder-img"
        height="100%" preserveAspectRatio="xMidYMid slice" width="100%">
      <div class="container">
        <div class="carousel-caption">
          <h1 class="texto">Los Productos de Dulce Muna</h1>
          <p class="texto">Personaliza todo con el nombre y diseño que mas te guste</p>
        </div>
      </div>
    </div>

    <!--imagen inicio-->


    <div class="slider-container">
  <button class="nav prev" (click)="scrollLeft()">&#8249;</button>
  <div class="card-track" #track>
    <div *ngFor="let tipo of tipos" class="card2">
      <img [src]="tipo.img" alt="{{tipo.nombre}}">
      <h2>{{tipo.nombre}}</h2>
    </div>
  </div>
  <button class="nav next" (click)="scrollRight()">&#8250;</button>
</div>
<!-- card tipos-->

<div class="card-container">
    <ng-container *ngIf="Productos && Productos.length">
        <ng-container *ngFor ="let producto of Productos">
            <div *ngIf ="producto.disponibilidad" class ="card">
                <img [src]="producto.img" alt="{{producto.nombre}}" class="product-img">
                <h2>{{producto.nombre}}</h2>
                <p>{{producto.descripcion}}</p>
                <p>Precio:{{producto.precio}}</p>
                <button type="button" class="btn btn-outline-primary" (click)="agregar(producto)">Agregar al carrito</button>
            </div>
        </ng-container>
    </ng-container>
</div>

<!--cards producto-->
